<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinitiate AI Logo</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <svg
    class="logo"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 2170 725"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-label="Tinitiate AI — Learn. Build. Lead the Future."
  >

    <!-- Yellow Tinitiate chevron -->
    <path
      fill="#FEFC05"
      d="M83.38,226.08L168.55,311.02L83.56,396.15L246.90,396.11L332.89,311.35L246.68,226.12L83.38,226.08Z"
    />

    <!-- TINITIATE AI wordmark -->
    <path
      fill="#000000"
      fill-rule="evenodd"
      d="<!-- exact wordmark path -->"
    />

    <!-- LEARN. BUILD. LEAD THE FUTURE. tagline -->
    <path
      fill="#000000"
      fill-rule="evenodd"
      d="<!-- exact tagline path -->"
    />

  </svg>

</body>
</html>
