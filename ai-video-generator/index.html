", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 24, "source": "DDL — Data Definition Language", "phase": "operation", "start": 17}, {"title": "DDL — Data Definition Language", "sql": "", "talk": "In SQL Server, DDL (Data Definition Language) encompasses a group of SQL commands that are used to create, modify, and remove the structure of database objects. These objects include tables, indexes, views, schemas, sequences, and more.", "focus": "", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 24, "source": "In SQL Server, DDL (Data Definition Language) encompasses a group of SQL commands that are used to create, modify, and remove the structure of database objects. These objects include tables, indexes, views, schemas, sequences, and more.", "phase": "operation", "start": 41}, {"title": "Primary DDL commands in SQL Server", "sql": "", "talk": "CREATE introduces a new database object. ALTER changes the definition of an existing object. DROP removes an object. Watch the schema preview respond to each command.", "focus": "", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 19, "source": "", "phase": "operation", "start": 65}, {"title": "CREATE · define new objects", "sql": "", "talk": "Used to create new database objects such as tables, indexes, views, schemas, sequences, and other objects. CREATE TABLE specifies a table name followed by column definitions and their data types.", "focus": "", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 21, "source": "Used to create new database objects such as tables, indexes, views, schemas, sequences, and other objects.", "phase": "operation", "start": 84}, {"title": "CREATE · database and schema setup", "sql": "-- Use database\nUSE tinitiate;", "talk": "USE selects the database context. Here tinitiate is the database where the following schema objects belong. The comment identifies the purpose of the statement.", "focus": "USE tinitiate;", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 20, "source": "", "phase": "operation", "start": 105}, {"title": "CREATE · database and schema setup", "sql": "-- Schema DDL\nCREATE SCHEMA employees;", "talk": "CREATE SCHEMA introduces a named container for database objects. The identifier employees is the schema name; new tables will be qualified with this prefix.", "focus": "CREATE SCHEMA employees;", "op": "schema", "table": "", "cols": [], "column": "", "typ": "", "duration": 20, "source": "", "phase": "operation", "start": 125}, {"title": "CREATE · database and schema setup", "sql": "CREATE USER ti WITH PASSWORD = 'Tinitiate!23';", "talk": "CREATE USER defines a database user called ti. WITH PASSWORD supplies the password shown in the original tutorial. This is example source SQL, not a credential you should reuse.", "focus": "CREATE USER ti", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 20, "source": "", "phase": "operation", "start": 145}, {"title": "CREATE · database and schema setup", "sql": "ALTER AUTHORIZATION ON SCHEMA::employees TO ti;", "talk": "ALTER AUTHORIZATION changes ownership of the employees schema to user ti. The double colon in SCHEMA::employees identifies the schema securable.", "focus": "ALTER AUTHORIZATION", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 20, "source": "", "phase": "operation", "start": 165}, {"title": "CREATE · database and schema setup", "sql": "-- Set the schema where you want to create the DB objects\nALTER USER ti WITH DEFAULT_SCHEMA = employees;", "talk": "ALTER USER changes a user property. DEFAULT_SCHEMA = employees makes employees the default schema for user ti when an unqualified object name is used.", "focus": "DEFAULT_SCHEMA", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 20, "source": "", "phase": "operation", "start": 185}, {"title": "CREATE TABLE · employees.dept", "sql": "-- Create table employees.dept\ ble defines loc as VARCHAR(13). Notice this precise type in the SQL and in the newly constructed schema row.", "focus": "loc", "op": "create", "table": "dept", "cols": [["deptno", "INT"], ["dname", "VARCHAR(100)"], ["loc", "VARCHAR(13)"]], "column": "loc", "typ": "VARCHAR(13)", "duration": 10, "source": "", "phase": "column", "start": 876}, {"title": "DDL · final schema", "sql": "", "talk": "You have followed CREATE, ALTER, DROP and recreation. The resulting schema contains dept, emp, salgrade, projects and emp_projects. The budget example ends at NUMERIC(12,2), and the recreated dept name column ends at VARCHAR(100).", "focus": "", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 23, "source": "", "phase": "operation", "start": 886}, {"title": "LEARN. BUILD. LEAD THE FUTURE.", "sql": "", "talk": "Tinitiate AI · SQL Server DDL. Practice reading every statement as a structural change: which object is selected, which column or type is specified, and what the resulting schema looks like.", "focus": "", "op": "", "table": "", "cols": [], "column": "", "typ": "", "duration": 17, "source": "", "phase": "operation", "start": 909}];const TOTAL=926,FPS=30;let current=0,playing=false,last=0;const $=id=>document.getElementById(id);function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function syntax(x){if(x.trim().startsWith('--'))return '<span class="comment">'+esc(x)+'</span>';return esc(x).replace(/('.*?')/g,'<span class="str">$1</span>').replace(/\b(CREATE|TABLE|SCHEMA|USER|USE|ALTER|DROP|COLUMN|ADD|WITH|PASSWORD|AUTHORIZATION|ON|TO|DEFAULT_SCHEMA)\b/gi,'<span class="kw">$1</span>').replace(/\b(INT|VARCHAR|NUMERIC|DECIMAL|DATE)(\([\d,]+\))?/gi,'<span class="type">$1$2</span>')}
function apply(m,b,p){if(!b.op||p<.44)return;if(b.op==='schema'){m.schema=true;return}if(b.op==='create'){if(b.phase==='column'||b.phase==='inspect'){m.tables[b.table]=b.cols.map(x=>[...x]);return}const n=Math.max(0,Math.min(b.cols.length,Math.floor((p-.44)/.36*(b.cols.length+1))));m.tables[b.table]=b.cols.slice(0,n).map(x=>[...x]);return}if(b.op==='drop'){if(p>.67)delete m.tables[b.table];return}if(!m.tables[b.table])return;let c=m.tables[b.table];if(p<.67)return;if(b.op==='add'&&!c.some(x=>x[0]===b.column))c.push([b.column,b.typ]);if(b.op==='remove')m.tables[b.table]=c.filter(x=>x[0]!==b.column);if(b.op==='change'){let x=c.find(x=>x[0]===b.column);if(x)x[1]=b.typ}}
function highlightTalk(raw,focus){
 const patterns=[
 [/\b(?:CREATE TABLE|CREATE SCHEMA|CREATE USER|ALTER TABLE|ALTER COLUMN|DROP COLUMN|DROP TABLE|DEFAULT_SCHEMA|ALTER AUTHORIZATION|ADD|DROP|CREATE|USE)\b/gi,'hl-op'],
 [/\bemployees\.(?:dept|emp_projects|salgrade|projects|emp)\b/gi,'hl-object'],
 [/\b(?:NUMERIC\(\d+(?:,\d+)?\)|DECIMAL\(\d+(?:,\d+)?\)|VARCHAR\(\d+\)|INT|DATE)\b/gi,'hl-type'],

 [/\b(?:hire_date|end_date|budget|deptno|dname|loc|empno|ename|job|mgr|sal|commission|projectno|monthly_commission|start_date|emp_projectno|grade|losal|hisal)\b/gi,'hl-result']
 ];
 const ranges=[];for(const [re,cls] of patterns){for(const m of raw.matchAll(re)){let a=m.index,z=a+m[0].length;if(!ranges.some(r=>a<r.z&&z>r.a))ranges.push({a,z,cls})}}ranges.sort((a,b)=>a.a-b.a);let out='',at=0;for(const r of ranges){out+=esc(raw.slice(at,r.a))+'<span class="'+r.cls+'">'+esc(raw.slice(r.a,r.z))+'</span>';at=r.z}return out+esc(raw.slice(at));
}
function updateOrbit(seconds){

 const segments=[['line',L],['arc',Q],['line',V],['arc',Q],['line',L],['arc',Q],['line',V],['arc',Q]];
 let x=radius,y=0;for(let i=0;i<segments.length;i++){let len=segments[i][1];if(d<=len){if(i===0)return [x+d,y];if(i===1){let a=-Math.PI/2+d/radius;return [w-radius+radius*Math.cos(a),radius+radius*Math.sin(a)]}if(i===2)return [w,radius+d];if(i===3){let a=d/radius;return [w-radius+radius*Math.cos(a),h-radius+radius*Math.sin(a)]}if(i===4)return [w-radius-d,h];if(i===5){let a=Math.PI/2+d/radius;return [radius+radius*Math.cos(a),h-radius+radius*Math.sin(a)]}if(i===6)return [0,h-radius-d];let a=Math.PI+d/radius;return [radius+radius*Math.cos(a),radius+radius*Math.sin(a)]}d-=len}return [radius,0]}
 for(const [id,phase,size] of [['aiBadge',0,37],['aiDot1',-.021,9],['aiDot2',-.039,9],['aiDot3',-.057,9]]){let el=$(id),pt=point(phase);el.style.transform='translate('+Math.round(pt[0]-size/2)+'px,'+Math.round(pt[1]-size/2)+'px)'}
}
function seek(sec){current=Math.max(0,Math.min(TOTAL-.001,sec));let i=BEATS.findIndex(b=>current<b.start+b.duration);if(i<0)i=BEATS.length-1;let b=BEATS[i],p=(current-b.start)/b.duration,m={schema:false,tables:{}};for(let j=0;j<i;j++)apply(m,BEATS[j],1);apply(m,b,p);$('counter').textContent='SQL SERVER DDL  /  CHAPTER '+String(i+1).padStart(2,'0')+' OF '+BEATS.length;$('title').textContent=b.title;$('teachText').innerHTML=highlightTalk(b.talk,b.focus);$('sourceNote').textContent=b.source?'ORIGINAL TUTORIAL EXPLANATION':'INSTRUCTOR EXPLANATION · SQL SOURCE PRESERVED';$('ambient').textContent=b.op?(b.op.toUpperCase()+' / '+(b.table||'employees')):'DATA DEFINITION';$('status').textContent=b.op?'SCHEMA CHANGE · '+b.op.toUpperCase():'SOURCE SQL';let lines=b.sql?b.sql.split('\n'):[];let vis=Math.min(lines.length,Math.max(0,Math.ceil(lines.length*Math.min(1,p/.27))));let target=lines.findIndex(l=>b.focus&&l.includes(b.focus));if(target<0)target=vis-1;$('code').innerHTML=lines.slice(0,vis).map((l,k)=>'<div class="line '+(k===target?'active':(b.focus?'dim':''))+'"><span class="num">'+String(k+1).padStart(2,'0')+'</span><span>'+syntax(l)+'</span></div>').join('');$('schemaName').style.opacity=m.schema?'1':'.52';$('tables').innerHTML=Object.entries(m.tables).sort((a,z)=>(a[0]===b.table?-1:z[0]===b.table?1:0)).map(([name,cols])=>'<div class="table '+(name===b.table?'focus':'')+'"><div class="tabletitle">▤ employees.'+esc(name)+'</div>'+cols.map(([n,t])=>'<div class="colrow '+(name===b.table&&n===b.column?'changed':'')+'"><span>'+esc(n)+'</span><span>'+esc(t)+'</span></div>').join('')+'</div>').join('');$('progress').style.width=(current/TOTAL*100)+'%';$('time').textContent=Math.floor(current/60)+':'+String(Math.floor(current%60)).padStart(2,'0')+' / '+Math.floor(TOTAL/60)+':'+String(Math.floor(TOTAL%60)).padStart(2,'0');$('diagram').style.transform='translateX('+Math.round(p*20)+'px)';updateOrbit(current);}
